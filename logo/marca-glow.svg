<!-- Ícone com brilho neon — para capas, apresentações, banners (não usar em tamanho pequeno) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="40" height="40" rx="10" fill="#030303"/>
  <g filter="url(#glow)">
    <circle cx="20" cy="20" r="16.5" stroke="#00F0FF" stroke-width="1.6" stroke-dasharray="78 26" stroke-linecap="round" transform="rotate(-40 20 20)"/>
    <path d="M12.5 11.5v17h7.5" stroke="#00F0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28.3 12.6c-4 0-6.4 1.8-6.4 4.3 0 2.7 2.5 3.4 5.5 4 3.5.7 6.7 1.5 6.7 4.8 0 2.8-2.7 4.6-6.9 4.6" stroke="#9D4EDD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
